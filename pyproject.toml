[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "werr"
version = "0.5.1"
authors = [
  { name="ITouch Systems", email="info@itouch.com.tr" },
  { name="Volkan Dagli", email="ask@answerr.me" }
]
description = "WERR: Zero-Memory Fractal System-One Decision Engine (Waves & Errors)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.6"
]

[project.urls]
"Homepage" = "https://github.com/pCwOrM/werr"
"Web Simulator" = "https://pcworm.github.io/werr/"
"answerr Platform" = "https://answerr.me"
"Base Research" = "https://github.com/pCwOrM/mandelbrot-fractal-neural-synthesis"

[tool.setuptools.packages.find]
where = ["."]
include = ["werr*", "wevv*"]
exclude = ["dataset*", "tests*", "examples*"]
